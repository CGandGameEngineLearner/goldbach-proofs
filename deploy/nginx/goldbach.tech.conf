map $uri $goldbach_access_log {
    default 1;
    ~^/auth/zhihu(?:/|$) 0;
}

server {
    listen 80;
    listen [::]:80;
    server_name goldbach.tech www.goldbach.tech;
    access_log /var/log/nginx/access.log combined if=$goldbach_access_log;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name goldbach.tech www.goldbach.tech;
    access_log /var/log/nginx/access.log combined if=$goldbach_access_log;
    ssl_certificate /etc/nginx/ssl/goldbach.tech/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/goldbach.tech/privkey.pem;
    client_max_body_size 256k;

    location = /auth/zhihu/sponsors/upload {
        client_max_body_size 5m;
        error_page 413 =413 /auth/zhihu/sponsors/upload-limit$is_args$args;
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_name www.movan.tech;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host $host;
        proxy_set_header X-Goldbach-Client-IP $remote_addr;
    }

    location = /auth/zhihu/sponsors/upload-limit {
        internal;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_name www.movan.tech;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host $host;
        proxy_set_header X-Goldbach-Client-IP $remote_addr;
    }

    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_name www.movan.tech;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host $host;
        proxy_set_header X-Goldbach-Client-IP $remote_addr;
    }
}
