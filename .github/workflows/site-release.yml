name: Website release verification
on:
  pull_request:
    paths: ['deploy/**', '.github/workflows/site-release.yml']
  push:
    branches: [main]
    paths: ['deploy/**', '.github/workflows/site-release.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the site image dependency
        run: python -m pip install 'Pillow>=12,<13'
      - name: Verify site modules and research services
        run: |
          python -m compileall -q deploy
          for file in deploy/*.js; do node --check "$file"; done
          python -B -m unittest deploy.test_zhihu deploy.test_github_identity deploy.test_presence deploy.test_desk deploy.test_rankings deploy.test_landau deploy.test_publish_catalogue research.test_catalogue
