name: Desk queue

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  pull-requests: read

concurrency:
  group: goldbach-desk-queue
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'CGandGameEngineLearner/goldbach-proofs'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DESK_URL: ${{ vars.GOLDBACH_DESK_URL }}
      DESK_SECRET: ${{ secrets.GOLDBACH_WEBHOOK_SECRET }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 deploy/dispatch_queue.py
